name: Daily Kids Video Pipeline

on:
  schedule:
    # Runs at 2:00 AM UTC daily (7:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches: [main]
    paths:
      - 'config.yaml'
      - 'run_daily_pipeline.py'

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    permissions:
      contents: read
      # Needed for uploading artifacts if needed
      
    steps:
      # ─── Checkout ───
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # ─── Setup Python ───
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      # ─── Install Dependencies ───
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests apscheduler
      
      # ─── Configure Git (for any commits if needed) ───
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
# ─── Run Pipeline ───
      - name: Run Daily Pipeline
        id: pipeline
        run: |
          python run_daily_pipeline.py
        env:
          PYTHONUNBUFFERED: 1
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KIE_API_TOKEN: ${{ secrets.KIE_API_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          LOG_LEVEL: DEBUG
      
      # ─── Upload Logs as Artifact ───
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: |
            logs/
            *.log
          retention-days: 7
      
      # ─── Notify on Failure ───
      - name: Notify failure
        if: failure()
        run: |
          # Send failure notification via Telegram if configured
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="❌ GitHub Actions: Daily pipeline failed! Check workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -d parse_mode="Markdown"
          fi

  # ─── Optional: Weekly Summary ───
  weekly-summary:
    needs: generate-and-publish
    if: github.event_name == 'schedule' && github.event.schedule == '0 2 * * 0'  # Sunday only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Generate weekly report
        run: |
          # This could query YouTube API for analytics
          echo "Weekly summary would go here"
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}