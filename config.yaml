# Kids Video Generator - non-secret settings.
#
# API keys are NOT stored here. They come from environment variables, which
# always win over anything in this file:
#   ANTHROPIC_API_KEY   KIE_API_TOKEN        IMGBB_API_KEY
#   ELEVENLABS_API_KEY  YOUTUBE_CLIENT_ID    YOUTUBE_CLIENT_SECRET
#   YOUTUBE_REFRESH_TOKEN  YOUTUBE_DATA_API_KEY
#   TELEGRAM_BOT_TOKEN  TELEGRAM_CHAT_ID
# In GitHub Actions add them under Settings > Secrets > Actions.
#
# Everything below is an override of kids_video/config.py DEFAULTS. Only keys
# you actually want to change need to be listed.

pipeline:
  # Python weekday(): Mon=0 .. Sun=6
  # Current plan: Short daily + one 5-minute story on Sunday, ~$135/month.
  # To scale up once retention data justifies it:
  #   daily 5-min story  -> move `long` to long_days: [0,1,2,3,4,5,6]  (~$386/mo)
  #   10-minute story    -> long.shot_count: 75                       (~$25/video)
  short_days: [0, 1, 2, 3, 4, 5, 6]   # a 60s Short every day
  long_days: [6]                      # the 5-minute story on Sunday
  # There is deliberately no topic list. Every episode is invented fresh by
  # Claude from the day's content type, live trend signals and the published
  # history, so stories never repeat.
  content_rotation:
    - adventure_story
    - moral_story
    - fun_facts
    - folk_tale
    - science_wonder
    - friendship_story
    - magical_story

short:
  shot_count: 8          # 8 x 8s = ~64 seconds
  friends_per_episode: 1
  aspect_ratio: "9:16"
  veo_model: veo3_fast   # veo3_lite $0.175 | veo3_fast $0.325 | veo3 $1.275 per clip

long:
  shot_count: 38         # 38 x 8s = ~5 minutes
  aspect_ratio: "16:9"
  veo_model: veo3_fast

story:
  model: claude-opus-4-6
  friends_per_episode: 2   # recurring friends featured alongside the host

voice:
  voice_id: "3AMU7jXQuQa3oRvRqUmb"   # Viraj, Hindi storyteller
  model_id: eleven_multilingual_v2

youtube:
  privacy_status: public
  made_for_kids: true

# The permanent cast lives in kids_video/config.py DEFAULTS and is pinned to
# data/cast.json by `python run_daily_pipeline.py setup-cast`. Once a reference
# sheet exists, do not edit a character's description or they will drift.

logging:
  level: INFO
  file: logs/pipeline.log
