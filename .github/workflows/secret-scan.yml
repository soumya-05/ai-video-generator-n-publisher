name: Secret scan

# GitHub's own push protection needs a paid plan on private repos, so scan
# ourselves. Runs on every push and PR, and on a weekly schedule to catch
# anything that slipped in before this workflow existed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan full history, not just the tip commit

      # gitleaks-action only scans the commits in the triggering push, so
      # anything committed before this workflow existed was never looked at.
      # Run the CLI instead: `gitleaks git` walks the entire history every time.
      - name: Run gitleaks over the full history
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --exit-code 1
