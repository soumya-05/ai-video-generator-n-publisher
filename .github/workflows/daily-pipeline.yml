name: Daily Science Video Pipeline

on:
  schedule:
    # 02:00 UTC = 07:30 IST
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan the video without spending any credits'
        type: boolean
        default: true
      only:
        description: 'Force one format'
        type: choice
        options: ['', 'short', 'long']
        default: ''
      skip_upload:
        description: 'Render but do not publish to YouTube'
        type: boolean
        default: false

concurrency:
  # Shared with telegram-requests.yml: two jobs polling Telegram at once would
  # each consume updates meant for the other.
  group: video-pipeline
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    # A 75-shot explainer renders in 18 chained scenes. Chains run concurrently
    # but the shots inside one are sequential, and veo3 Quality is slower than
    # veo3_fast - plus up to an hour waiting for the Telegram approval. 360 is
    # the GitHub ceiling for a job.
    timeout-minutes: 350

    permissions:
      # The pipeline commits data/history.json back so tomorrow's script knows
      # what has already aired.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run pipeline
        run: |
          ARGS="run"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.skip_upload }}" = "true" ]; then ARGS="$ARGS --skip-upload"; fi
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          python run_daily_pipeline.py $ARGS
        env:
          PYTHONUNBUFFERED: 1
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KIE_API_TOKEN: ${{ secrets.KIE_API_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit published history
        if: success() && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --staged --quiet || git commit -m "chore: record published episode [skip ci]"
          # The other workflow commits the same file, so main has usually moved
          # during the hour this job spent rendering.
          git pull --rebase
          git push

      - name: Upload logs and story artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: |
            logs/
            build/**/*.json
            build/**/final.mp4
          retention-days: 7

      # Covers failures the pipeline's own notifier cannot report, e.g. the job
      # dying before Python starts.
      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="GitHub Actions: daily pipeline failed. https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
