name: Telegram Topic Requests

# Picks up topics sent to the bot as:
#   /make how a washing machine works
#   /make long CRISPR gene editing | focus on the delivery problem
# The script is written first, sent back for approval, and only then rendered.

on:
  schedule:
    # Every 15 minutes. GitHub delays scheduled runs under load, so treat this
    # as "within about half an hour", not a guarantee.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Write the script without spending any credits'
        type: boolean
        default: false

concurrency:
  # Must not overlap with itself or the daily run, or two jobs would fight over
  # the same Telegram update queue and each would swallow the other's messages.
  group: video-pipeline
  cancel-in-progress: false

jobs:
  serve-requests:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Serve requests
        run: |
          ARGS="listen"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python run_daily_pipeline.py $ARGS
        env:
          PYTHONUNBUFFERED: 1
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KIE_API_TOKEN: ${{ secrets.KIE_API_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit published history
        if: success() && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Commit before pulling: the run has already written history.json, and
          # rebase refuses to start with unstaged changes in the tree.
          git add data/history.json
          git diff --staged --quiet || git commit -m "chore: record requested video [skip ci]"
          git pull --rebase
          git push

      - name: Upload logs and script artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: request-logs
          path: |
            logs/
            build/**/*.json
          retention-days: 7
